refresh_devices:
  name: 刷新设备快照
  description: 立即刷新指定配置项的云端设备库存和状态快照
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 需要刷新的 ORVIBO Smart Control 配置项 ID
      required: true
      example: "0123456789abcdef"

set_lock_user_name:
  name: 设置门锁用户名称
  description: 把门锁 userId 映射为可读名称；传入空名称可清除映射
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（如 w-xxxx，可在设备信息中查看）
      required: true
      example: "w-example-door-lock-id"
    user_id:
      name: 用户 ID
      description: 门锁用户编号（来自 unlockEvent 的 unlock_user_id）
      required: true
      example: "2"
    name:
      name: 用户名称
      description: 用户名称（留空清除）
      required: true
      example: "张三"

fetch_video:
  name: 归档门锁事件录像
  description: 下载 H.264 事件录像并在可用时转封装为 MP4；响应只返回媒体 ID
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（如 w-xxxx，可在设备信息中查看）
      required: true
      example: "w-example-door-lock-id"
    object_key:
      name: 录像对象键
      description: 事件里的 video_url（如 /uid/videoPicklockEvent/xxx.h264）
      required: true
      example: "/example-device-id/videoPicklockEvent/picklockEvent_1700000000.h264"

list_events:
  name: 列出门锁媒体历史
  description: 按时间倒序列出已归档的截图和录像，并返回媒体浏览器引用
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空查询所有门锁）
      required: false
      example: "w-example-door-lock-id"
    limit:
      name: 返回条数
      description: 最多返回的记录数（默认 100）
      required: false
      example: 50

cleanup_history:
  name: 清理门锁媒体历史
  description: 按保留天数和可选条数限制删除旧截图与录像
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    keep_days:
      name: 保留天数
      description: 保留最近 N 天的记录（默认 7）
      required: false
      example: 7
    device_id:
      name: 设备 ID
      description: 只清理指定门锁（留空清理所有）
      required: false
      example: "w-example-door-lock-id"
    max_entries:
      name: 最大条数
      description: 每个设备最多保留的记录数（可选，按时间裁剪最旧的）
      required: false
      example: 500

grant_temp_password:
  name: 创建临时门锁授权
  description: 创建限时或临时授权；密码只在本次服务响应中返回
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空自动选第一把门锁）
      required: false
      example: "w-example-door-lock-id"
    type:
      name: 授权类型
      description: "1=限时（start_time/end_time 或 minutes） 2=临时（minutes+number，默认）"
      required: false
      example: 2
    minutes:
      name: 有效期（分钟）
      description: 相对时长（默认 1440=24 小时）
      required: false
      example: 1440
    number:
      name: 可用次数
      description: "0=不限次；type=2 默认 1"
      required: false
      example: 1
    name:
      name: 临时用户名
      description: 显示名称（默认自动生成"临时用户 MMddHHmm"）
      required: false
      example: "快递员"
    phone:
      name: 手机号
      description: 可选：下发时同步短信通知该手机号
      required: false
      example: "13800138000"
    start_time:
      name: 开始时间
      description: Unix 秒时间戳（type=1 限时用；默认当前时间）
      required: false
      example: 1785805200
    end_time:
      name: 结束时间
      description: Unix 秒时间戳（type=1 限时用；默认 now+minutes）
      required: false
      example: 1785978000

revoke_temp_password:
  name: 撤销临时门锁授权
  description: 按 authorizedId 撤销指定门锁的临时授权
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID
      required: true
      example: "w-example-door-lock-id"
    authorized_id:
      name: 授权 ID
      description: 下发响应或 list_temp_passwords 里的 authorized_id
      required: true
      example: 101

list_temp_passwords:
  name: 列出临时门锁授权
  description: 查询服务器端临时授权元数据和过期状态；不返回密码明文
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空查询所有）
      required: false
      example: "w-example-door-lock-id"
