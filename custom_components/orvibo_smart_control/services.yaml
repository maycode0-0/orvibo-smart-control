refresh_devices:
  name: 刷新设备快照
  description: 立即刷新指定配置项的云端设备库存和状态快照
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 需要刷新的 ORVIBO Smart Control 配置项 ID
      required: true
      example: "0123456789abcdef"

set_lock_user_name:
  name: 设置门锁用户名称
  description: 把门锁 userId 映射为可读名称；传入空名称可清除映射
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（如 w-xxxx，可在设备信息中查看）
      required: true
      example: "w-example-door-lock-id"
    user_id:
      name: 用户 ID
      description: 门锁用户编号（来自 unlockEvent 的 unlock_user_id）
      required: true
      example: "2"
    name:
      name: 用户名称
      description: 用户名称（留空清除）
      required: true
      example: "张三"

fetch_video:
  name: 归档门锁事件录像
  description: 下载 H.264 事件录像并在可用时转封装为 MP4；响应只返回媒体 ID
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（如 w-xxxx，可在设备信息中查看）
      required: true
      example: "w-example-door-lock-id"
    object_key:
      name: 录像对象键
      description: 事件里的 video_url（如 /uid/videoPicklockEvent/xxx.h264）
      required: true
      example: "/example-device-id/videoPicklockEvent/picklockEvent_1700000000.h264"

list_events:
  name: 列出门锁媒体历史
  description: 按时间倒序列出已归档的截图和录像，并返回媒体浏览器引用
  target: {}
  fields:
    media_type:
      name: 媒体类型
      description: 可选 image（抓拍）或 video（录像），筛选后再应用返回条数
      required: false
      selector:
        select:
          options:
            - image
            - video
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空查询所有门锁）
      required: false
      example: "w-example-door-lock-id"
    limit:
      name: 返回条数
      description: 最多返回的记录数（默认 100）
      required: false
      example: 50

list_openings:
  name: 列出开门记录
  description: 按时间倒序查询本地开门记录；内开只返回方向和时间，外开可含人员及开锁方式
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 多配置项时建议提供
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID
      required: true
      example: "w-example-door-lock-id"
    limit:
      name: 返回条数
      description: 最多返回 1–500 条记录（默认 100）
      required: false
      example: 30

cleanup_history:
  name: 清理门锁历史
  description: 按保留天数和可选条数限制删除旧开门记录、截图与录像
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    keep_days:
      name: 保留天数
      description: 保留最近 N 天的记录（默认 7）
      required: false
      example: 7
    device_id:
      name: 设备 ID
      description: 只清理指定门锁（留空清理所有）
      required: false
      example: "w-example-door-lock-id"
    max_entries:
      name: 最大条数
      description: 每个设备最多保留的记录数（可选，按时间裁剪最旧的）
      required: false
      example: 500

grant_temp_password:
  name: 创建临时门锁授权
  description: 创建限时或临时授权；密码只在本次服务响应中返回
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选；有多个配置项时建议提供）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空自动选第一把门锁）
      required: false
      example: "w-example-door-lock-id"
    type:
      name: 授权类型
      description: "1=限时（start_time/end_time 或 minutes） 2=临时（minutes+number，默认）"
      required: false
      example: 2
    minutes:
      name: 有效期（分钟）
      description: 相对时长（默认 1440=24 小时）
      required: false
      example: 1440
    number:
      name: 可用次数
      description: "0=不限次；type=2 默认 1"
      required: false
      example: 1
    name:
      name: 临时用户名
      description: 显示名称（默认自动生成"临时用户 MMddHHmm"）
      required: false
      example: "快递员"
    phone:
      name: 手机号
      description: 可选：下发时同步短信通知该手机号
      required: false
      example: "13800138000"
    start_time:
      name: 开始时间
      description: Unix 秒时间戳（type=1 限时用；默认当前时间）
      required: false
      example: 1785805200
    end_time:
      name: 结束时间
      description: Unix 秒时间戳（type=1 限时用；默认 now+minutes）
      required: false
      example: 1785978000

revoke_temp_password:
  name: 撤销临时门锁授权
  description: 按 authorizedId 撤销指定门锁的临时授权
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID
      required: true
      example: "w-example-door-lock-id"
    authorized_id:
      name: 授权 ID
      description: 下发响应或 list_temp_passwords 里的 authorized_id
      required: true
      example: 101

list_temp_passwords:
  name: 列出临时门锁授权
  description: 查询服务器端临时授权元数据和过期状态；不返回密码明文
  target: {}
  fields:
    entry_id:
      name: 配置项 ID
      description: 集成配置项 ID（可选）
      required: false
      example: "0123456789abcdef"
    device_id:
      name: 设备 ID
      description: 门锁设备 ID（留空查询所有）
      required: false
      example: "w-example-door-lock-id"

inspect_video_session:
  name: 检查录像机厂商会话
  description: 复用已连接的欧瑞博云会话检查 Meari 授权，仅返回脱敏诊断；不播放视频。
  fields:
    entry_id:
      name: 配置项 ID
      description: 只有一个欧瑞博配置项时可留空。
      selector:
        text:
    country_code:
      name: 国家代码
      default: CN
      selector:
        text:
    phone_code:
      name: 电话区号
      default: "86"
      selector:
        text:
    language:
      name: 语言
      default: zh
      selector:
        select:
          options:
            - zh
            - en

inspect_video_devices:
  name: 检查录像机厂商设备列表
  description: 获取 Meari 会话并请求厂商设备列表，返回数量和能力字段诊断；不连接设备、不播放视频。
  fields:
    entry_id:
      name: 配置项 ID
      description: 只有一个欧瑞博配置项时可留空。
      selector:
        text:
    country_code:
      name: 国家代码
      default: CN
      selector:
        text:
    phone_code:
      name: 电话区号
      default: "86"
      selector:
        text:
    language:
      name: 语言
      default: zh
      selector:
        select:
          options:
            - zh
            - en

inspect_video_channels:
  name: 检查录像机通道
  description: 获取 Meari 会话、设备列表及 NVR 云端通道快照，返回脱敏编号、状态和能力码；尚不播放实时或硬盘录像。
  fields:
    entry_id:
      name: 配置项 ID
      description: 只有一个欧瑞博配置项时可留空。
      selector:
        text:
    country_code:
      name: 国家代码
      default: CN
      selector:
        text:
    phone_code:
      name: 电话区号
      default: "86"
      selector:
        text:
    language:
      name: 语言
      default: zh
      selector:
        select:
          options:
            - zh
            - en

probe_video_stream:
  name: 测试指定通道的视频连接
  description: 限时连接一个 XTS 设备通道并检查编码关键帧；完成或超时后停止进程，不保存画面。此动作不提供播放或硬盘回放。
  fields:
    entry_id:
      name: 配置项 ID
      description: 多个欧瑞博配置项时必须指定
      example: "0123456789abcdef"
    device_index:
      name: 设备序号
      description: inspect_video_devices 返回的 index；设备列表变化后请重新确认
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 512
          mode: box
    channel_id:
      name: 通道编号
      description: inspect_video_channels 返回的 channel_id；普通 IPC 使用 0
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 128
          mode: box
    timeout_seconds:
      name: 媒体连接时限
      description: 10 至 60 秒，默认 35 秒；获取云授权和设备列表另需时间
      example: 35
      selector:
        number:
          min: 10
          max: 60
          mode: box
    country_code:
      name: 国家代码
      description: 与已有视频会话诊断一致，默认 CN
      example: "CN"
    phone_code:
      name: 电话区号
      description: 默认 86
      example: "86"
    language:
      name: 语言
      description: zh 或 en，默认 zh
      example: "zh"

search_hdd_recordings:
  name: 查询硬盘或存储卡录像
  description: 按设备日历查询硬盘或存储卡当月有录像的日期或当天片段；首次 P2P 连接可能需要约一分钟
  fields:
    entity_id:
      name: 录像回放实体
      description: 选择名称含“硬盘回放”或“存储卡回放”的摄像头实体
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
    operation:
      name: 查询范围
      default: day
      selector:
        select:
          options:
            - month
            - day
    date:
      name: 设备日历日期
      description: 月查询用 YYYYMM，日查询用 YYYYMMDD，不转换 HA 时区
      required: true
      example: "20261015"
      selector:
        text:

start_hdd_playback:
  name: 选择硬盘或存储卡回放时间
  description: 选择起始时间后打开对应录像回放 camera 播放；重新选时会关闭上一段连接
  fields:
    entity_id:
      name: 录像回放实体
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
    date:
      name: 设备回放时间
      description: 设备日历时间 YYYYMMDDHHmmss；不会转换 HA 时区
      required: true
      example: "20261015090000"
      selector:
        text:

stop_hdd_playback:
  name: 停止硬盘或存储卡回放
  description: 关闭指定实体的录像回放和转码进程；实时画面使用独立实体
  fields:
    entity_id:
      name: 录像回放实体
      required: true
      selector:
        entity:
          integration: orvibo_smart_control
          domain: camera
